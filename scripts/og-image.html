<!--
  Source for public/og.png (1200x630 link-preview image). Regenerate with:
  google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
    --virtual-time-budget=5000 --screenshot=public/og.png scripts/og-image.html
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Geist:wght@400&family=Geist+Mono&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 88px;
        background: #f8f4ec;
        color: #1b1a17;
        font-family: 'Geist', sans-serif;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 20px;
        border-bottom: 1px solid #e4dccd;
      }
      .mark {
        font: 600 44px/1 'Bodoni Moda', serif;
      }
      .mono {
        font: 22px/1.4 'Geist Mono', monospace;
        color: #5c574f;
      }
      .red {
        color: #b5321c;
      }
      h1 {
        font: 400 136px/0.95 'Bodoni Moda', serif;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-style: italic;
      }
      p {
        margin-top: 28px;
        font-size: 36px;
        line-height: 1.35;
      }
      .cursor {
        display: inline-block;
        width: 20px;
        height: 3px;
        margin-left: 6px;
        background: #b5321c;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="mark">PM<span class="red">.</span></span>
      <span class="mono">paolomissagia.com</span>
    </div>
    <div>
      <h1>Paolo <em>Missagia</em></h1>
      <p>Full stack developer, crafting software with AI<span class="cursor"></span></p>
    </div>
    <span class="mono">building software since 2022</span>
  </body>
</html>
