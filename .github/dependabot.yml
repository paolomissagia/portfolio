version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR per week for non-breaking updates; majors still get their own PR
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet (peer: <6.1).
      # Remove this once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
